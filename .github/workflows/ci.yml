name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate single-file app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML structure + inline JS syntax
        # 单文件纯前端应用：无构建步骤，直接做结构与脚本静态校验。
        run: python3 scripts/validate_html.py